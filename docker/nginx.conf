# nginx.conf — Production config cho Flutter web serving.
#
# Vai trò: serve static files từ /usr/share/nginx/html + SPA fallback.
# KHÔNG proxy /api/* hay /uploads/* vì FE gọi thẳng URL Cloudflare của BE
# (vd: https://api.simshop.example.com/api/...) — không qua Nginx nội bộ.
#
# Override /etc/nginx/conf.d/default.conf của image nginx:alpine.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ----- Logging -----
    # Production: chỉ log lỗi + quét đáng ngờ, không log mọi GET 200.
    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/error.log warn;

    # ----- Security headers -----
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    # HSTS chỉ áp dụng qua HTTPS — Cloudflare terminate TLS nên bật OK.
    # 6 tháng cho production; Cloudflare thêm `Strict-Transport-Security`
    # riêng với giá trị dài hơn nên trùng là an toàn.
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # Bỏ nginx version khỏi response (server_tokens off ở http block).

    # ----- Gzip -----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf;

    # ----- Cache policy -----
    # Assets đã hash trong tên (fonts, ảnh tĩnh): cache 1 năm,
    # immutable. Flutter build đặt tên `assets/fonts/Roboto-Regular.ttf`
    # (KHÔNG hash) — font vẫn cache 1 năm, OK vì deploy mới copy lại
    # cùng path, file content-thay-đổi sẽ ăn CDN mới.
    location ~* \.(?:woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ----- Flutter entrypoints (cùng tên mỗi build) -----
    # main.dart.js / main.dart.wasm / flutter_bootstrap.js KHÔNG có
    # content hash → CDN sẽ cache cũ mãi nếu không ép revalidate.
    # `no-cache, must-revalidate` yêu cầu client + Cloudflare phải
    # hỏi lại server mỗi request để xem có bản mới không.
    location = /main.dart.js {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
        try_files $uri =404;
    }
    location = /main.dart.wasm {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
        try_files $uri =404;
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
        try_files $uri =404;
    }
    # Các file JS/CSS còn lại (canvaskit, asset bundles): cache ngắn,
    # revalidate mỗi deploy.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
        try_files $uri =404;
    }

    # index.html — không cache để rollout luôn hiệu lực.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ----- Healthcheck endpoint cho Docker HEALTHCHECK và Cloudflare monitor -----
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ----- SPA fallback -----
    # Mọi route không khớp file → index.html để Flutter go_router xử lý.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ẩn các file nhạy cảm không nên lộ.
    location ~ /\.(env|git|well-known) {
        deny all;
        return 404;
    }
}

# Server tokens off ở http block — bỏ version nginx khỏi header.
# (Set trong Dockerfile.web qua sed ở RUN trên.)
