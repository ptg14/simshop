name: simshop
description: "E-commerce mobile app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  cached_network_image: ^3.3.0
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.0
  file_picker: ^8.0.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  flutter_markdown_plus: ^1.0.7
  http: ^1.1.0
  image_picker: ^1.2.2
  intl: ^0.19.0
  photo_view: ^0.15.0
  provider: ^6.0.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
